name: Fix 1-Speed Control

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore original 1-speed behavior and add touch controls
        shell: bash
        run: |
          set -euo pipefail

          #
          # Start from the known-good PerformanceCluster that still used
          # the original Engine Simulator 1 / SPEED semantics.
          #
          git show ac1b230b3bfb4cbe43dac4182a594cc48f100e2e:src/performance_cluster.cpp \
            > src/performance_cluster.cpp

          python3 <<'PY'
          from pathlib import Path

          cpp_path = Path("src/performance_cluster.cpp")
          hdr_path = Path("include/performance_cluster.h")

          cpp = cpp_path.read_text()
          hdr = hdr_path.read_text()

          # ------------------------------------------------------------
          # Required geometry declaration for the horizontal chevrons.
          # ------------------------------------------------------------

          include_anchor = '#include "../include/engine_sim_application.h"\n'

          if '#include "../include/geometry_generator.h"' not in cpp:
              cpp = cpp.replace(
                  include_anchor,
                  include_anchor +
                  '#include "../include/geometry_generator.h"\n'
              )

          # ------------------------------------------------------------
          # Make PerformanceCluster itself clickable.
          # ------------------------------------------------------------

          ctor_anchor = """    m_audioLatency = 0.0;
          }
          """

          ctor_replacement = """    m_audioLatency = 0.0;

              /*
               * This cluster now owns the left/right touch regions
               * around the 1 / SPEED gauge.
               */
              m_checkMouse = true;
          }
          """

          if ctor_anchor not in cpp:
              raise RuntimeError("Constructor anchor not found")

          cpp = cpp.replace(
              ctor_anchor,
              ctor_replacement,
              1
          )

          # ------------------------------------------------------------
          # Keep the corrected latency label.
          # ------------------------------------------------------------

          latency_old = """    m_audioLagGauge->m_unit =
                  "%";

              m_audioLagGauge
                  ->m_spaceBeforeUnit =
                      false;
          """

          latency_new = """    m_audioLagGauge->m_unit =
                  "ms";

              m_audioLagGauge
                  ->m_spaceBeforeUnit =
                      true;
          """

          if latency_old not in cpp:
              raise RuntimeError("Latency unit anchor not found")

          cpp = cpp.replace(
              latency_old,
              latency_new,
              1
          )

          # ------------------------------------------------------------
          # Give the parent the current bounds for touch hit-testing.
          # ------------------------------------------------------------

          update_old = """void PerformanceCluster::update(float dt) {
              UiElement::update(dt);
          """

          update_new = """void PerformanceCluster::update(float dt) {
              m_mouseBounds = m_bounds;

              UiElement::update(dt);
          """

          if update_old not in cpp:
              raise RuntimeError("Update anchor not found")

          cpp = cpp.replace(
              update_old,
              update_new,
              1
          )

          # ------------------------------------------------------------
          # Add horizontal equivalent of the existing gear chevrons.
          # ------------------------------------------------------------

          render_anchor = """void PerformanceCluster::render() {
          """

          controls = r'''
          void PerformanceCluster::onMouseClick(
              const Point &mouseLocal)
          {
              UiElement::onMouseClick(
                  mouseLocal);

              if (m_simulator == nullptr) {
                  return;
              }

              const Bounds cell =
                  simulationSpeedCellBounds();

              const Bounds left =
                  cell.horizontalSplit(
                      0.0f,
                      0.18f);

              const Bounds right =
                  cell.horizontalSplit(
                      0.82f,
                      1.0f);

              if (left.overlaps(mouseLocal)) {
                  changeSimulationTimeDivision(-1);
              }
              else if (right.overlaps(mouseLocal)) {
                  changeSimulationTimeDivision(1);
              }
          }

          Bounds PerformanceCluster::simulationSpeedCellBounds() const
          {
              Grid grid;

              grid.h_cells = 3;
              grid.v_cells = 2;

              return grid.get(
                  m_bounds,
                  2,
                  0);
          }

          void PerformanceCluster::changeSimulationTimeDivision(
              int direction)
          {
              if (m_simulator == nullptr) {
                  return;
              }

              const double simulationSpeed =
                  m_simulator
                      ->getSimulationSpeed();

              /*
               * The gauge displays 1 / SPEED.
               *
               * Engine Simulator's actual simulator setting is the
               * reciprocal:
               *
               * display 1    -> speed 1.0
               * display 10   -> speed 0.1
               * display 100  -> speed 0.01
               * display 1000 -> speed 0.001
               *
               * Keep realtime (1) as the lower stop so the user can
               * always return to normal time.
               */
              double division =
                  simulationSpeed > 0.0
                      ? 1.0 / simulationSpeed
                      : 1.0;

              double nextDivision =
                  division;

              if (direction > 0) {
                  if (division < 5.0) {
                      nextDivision = 10.0;
                  }
                  else if (division < 50.0) {
                      nextDivision = 100.0;
                  }
                  else {
                      nextDivision = 1000.0;
                  }
              }
              else if (direction < 0) {
                  if (division > 500.0) {
                      nextDivision = 100.0;
                  }
                  else if (division > 50.0) {
                      nextDivision = 10.0;
                  }
                  else {
                      nextDivision = 1.0;
                  }
              }

              m_simulator
                  ->setSimulationSpeed(
                      1.0 / nextDivision);
          }

          void PerformanceCluster::drawTimeChevron(
              const Bounds &bounds,
              bool pointsRight)
          {
              const Point center =
                  getRenderPoint(
                      bounds.getPosition(
                          Bounds::center));

              const float size =
                  pixelsToUnits(
                      std::fmin(
                          bounds.width(),
                          bounds.height())
                      * 0.25f);

              const float halfWidth =
                  size * 0.65f;

              const float halfHeight =
                  size;

              const float baseX =
                  center.x
                  + (
                      pointsRight
                          ? -halfWidth
                          : halfWidth
                    );

              const float pointX =
                  center.x
                  + (
                      pointsRight
                          ? halfWidth
                          : -halfWidth
                    );

              GeometryGenerator::Line2dParameters line;

              line.lineWidth =
                  pixelsToUnits(
                      3.0f);

              GeometryGenerator *generator =
                  m_app
                      ->getGeometryGenerator();

              GeometryGenerator::GeometryIndices
                  chevron;

              generator->startShape();

              line.x0 =
                  baseX;

              line.y0 =
                  center.y
                  - halfHeight;

              line.x1 =
                  pointX;

              line.y1 =
                  center.y;

              generator->generateLine2d(
                  line);

              line.x0 =
                  pointX;

              line.y0 =
                  center.y;

              line.x1 =
                  baseX;

              line.y1 =
                  center.y
                  + halfHeight;

              generator->generateLine2d(
                  line);

              generator->endShape(
                  &chevron);

              resetShader();

              m_app
                  ->getShaders()
                  ->SetBaseColor(
                      m_app
                          ->getForegroundColor());

              m_app->drawGenerated(
                  chevron,
                  0x11,
                  m_app
                      ->getShaders()
                      ->GetUiFlags());
          }

          '''

          if render_anchor not in cpp:
              raise RuntimeError("Render anchor not found")

          cpp = cpp.replace(
              render_anchor,
              controls + render_anchor,
              1
          )

          # ------------------------------------------------------------
          # Replace the original gauge placement with a center gauge and
          # horizontal left/right controls.
          #
          # The actual displayed value remains the original:
          #     1 / getSimulationSpeed()
          # ------------------------------------------------------------

          speed_old = """    m_simSpeedGauge->m_bounds =
                  grid.get(
                      m_bounds,
                      2,
                      0);

              const double simulationSpeed =
                  m_simulator
                      ->getSimulationSpeed();

              m_simSpeedGauge
                  ->m_gauge
                  ->m_value =
                      simulationSpeed > 0.0
                          ? 1.0f
                              / static_cast<float>(
                                  simulationSpeed)
                          : 0.0f;
          """

          speed_new = """    const Bounds simulationSpeedCell =
                  grid.get(
                      m_bounds,
                      2,
                      0);

              /*
               * Leave room on either side of the gauge for the same
               * chevron interaction used by the gear selector, rotated
               * ninety degrees.
               */
              const Bounds simulationSpeedGaugeBounds =
                  simulationSpeedCell
                      .horizontalSplit(
                          0.18f,
                          0.82f);

              const Bounds simulationSpeedLeft =
                  simulationSpeedCell
                      .horizontalSplit(
                          0.0f,
                          0.18f);

              const Bounds simulationSpeedRight =
                  simulationSpeedCell
                      .horizontalSplit(
                          0.82f,
                          1.0f);

              m_simSpeedGauge->m_bounds =
                  simulationSpeedGaugeBounds;

              const double simulationSpeed =
                  m_simulator
                      ->getSimulationSpeed();

              /*
               * Restore the original Engine Simulator meaning:
               *
               *      displayed value = 1 / configured simulation speed
               *
               * It is NOT a measured realtime-performance ratio.
               */
              m_simSpeedGauge
                  ->m_gauge
                  ->m_value =
                      simulationSpeed > 0.0
                          ? 1.0f
                              / static_cast<float>(
                                  simulationSpeed)
                          : 0.0f;

              drawTimeChevron(
                  simulationSpeedLeft,
                  false);

              drawTimeChevron(
                  simulationSpeedRight,
                  true);
          """

          if speed_old not in cpp:
              raise RuntimeError("Simulation speed render anchor not found")

          cpp = cpp.replace(
              speed_old,
              speed_new,
              1
          )

          # ------------------------------------------------------------
          # Header declarations.
          # ------------------------------------------------------------

          header_public_anchor = """        virtual void update(float dt);
                  virtual void render();
          """

          header_public_new = """        virtual void update(float dt);
                  virtual void render();

                  virtual void onMouseClick(
                      const Point &mouseLocal);
          """

          if header_public_anchor not in hdr:
              raise RuntimeError("Header public anchor not found")

          hdr = hdr.replace(
              header_public_anchor,
              header_public_new,
              1
          )

          header_protected_anchor = """    protected:
                  double m_timePerTimestep;
          """

          header_protected_new = """    protected:
                  Bounds simulationSpeedCellBounds() const;

                  void changeSimulationTimeDivision(
                      int direction);

                  void drawTimeChevron(
                      const Bounds &bounds,
                      bool pointsRight);

                  double m_timePerTimestep;
          """

          if header_protected_anchor not in hdr:
              raise RuntimeError("Header protected anchor not found")

          hdr = hdr.replace(
              header_protected_anchor,
              header_protected_new,
              1
          )

          cpp_path.write_text(cpp)
          hdr_path.write_text(hdr)

          print("1 / SPEED control patched successfully.")
          PY

      - name: Verify important behavior
        shell: bash
        run: |
          set -euo pipefail

          grep -q 'getSimulationSpeed' src/performance_cluster.cpp
          grep -q 'setSimulationSpeed' src/performance_cluster.cpp
          grep -q 'changeSimulationTimeDivision' src/performance_cluster.cpp
          grep -q 'drawTimeChevron' src/performance_cluster.cpp
          grep -q '"ms"' src/performance_cluster.cpp

          echo "Time control verification passed."

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            src/performance_cluster.cpp \
            include/performance_cluster.h

          git commit -m "Restore simulation time gauge and add touch controls"

          git push
