name: Portable CMake checks
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]


jobs:
  core:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            configure: linux-x86_64
            build: linux-x86_64
            test: linux-x86_64
          # Pin an Apple-Silicon host: macos-latest is arm64 today, but an
          # explicit version makes the architecture and CI target unambiguous.
          - os: macos-15
            configure: macos-arm64
            build: macos-arm64
            test: macos-arm64
          - os: windows-latest
            configure: windows-x86_64
            build: windows-x86_64
            test: windows-x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake --preset ${{ matrix.configure }}
      - name: Build
        run: cmake --build --preset ${{ matrix.build }}
      - name: Test
        run: ctest --preset ${{ matrix.test }}

  desktop-audio:
    name: SDL audio smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            architecture_args: ''
          - os: macos-15
            architecture_args: -DCMAKE_OSX_ARCHITECTURES=arm64
          - os: windows-latest
            architecture_args: ''
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure SDL audio test
        run: >-
          cmake -S . -B build/ci-desktop-audio -G Ninja
          -DBUILD_TESTING=ON
          -DENGINE_SIM_BUILD_DESKTOP=ON
          -DENGINE_SIM_BUILD_SCRIPTING=OFF
          ${{ matrix.architecture_args }}
      - name: Build SDL audio smoke test
        run: cmake --build build/ci-desktop-audio --target engine-sim-desktop-audio-tests
      - name: Run SDL audio smoke test
        run: ctest --test-dir build/ci-desktop-audio --output-on-failure -R SdlAudioOutput
