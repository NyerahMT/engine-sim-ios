name: Portable CMake checks

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  validate:
    name: Validate (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            preset: linux-x86_64
          # Pin an Apple-Silicon host: macos-latest is arm64 today, but an
          # explicit version makes the architecture and CI target unambiguous.
          - name: macOS arm64
            os: macos-15
            preset: macos-arm64
          - name: Windows x86_64
            os: windows-latest
            preset: windows-x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install macOS parser tools
        if: runner.os == 'macOS'
        run: |
          brew install bison flex
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"

      - name: Install Windows parser tools
        if: runner.os == 'Windows'
        run: |
          choco install winflexbison3 --no-progress --yes
          if (-not (Get-Command win_flex.exe -ErrorAction SilentlyContinue)) {
            throw "winflexbison3 did not provide win_flex.exe"
          }
          if (-not (Get-Command win_bison.exe -ErrorAction SilentlyContinue)) {
            throw "winflexbison3 did not provide win_bison.exe"
          }

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxkbcommon-dev libwayland-dev libdecor-0-dev

      - name: Configure
        run: >-
          cmake --preset ${{ matrix.preset }}
          -DENGINE_SIM_BUILD_DESKTOP=ON
          -DENGINE_SIM_BUILD_SCRIPTING=ON

      - name: Build
        run: cmake --build build/${{ matrix.preset }}

      - name: Run core tests
        run: >-
          ctest --test-dir build/${{ matrix.preset }} --output-on-failure
          --exclude-regex SdlAudioOutput

      - name: Run SDL audio smoke test
        run: >-
          ctest --test-dir build/${{ matrix.preset }} --output-on-failure
          --tests-regex SdlAudioOutput
