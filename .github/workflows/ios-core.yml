name: EngineSim iOS

on:
  push:
    branches:
      - master
      - main

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-sim-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:

  ios:

    name: EngineSim iPhone

    runs-on: macos-15

    env:
      BUILD_DIR: build/ios
      FETCHCONTENT_DIR: ${{ github.workspace }}/.cache/fetchcontent

      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1

    steps:

      # ============================================================
      # Source
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1


      # ============================================================
      # Dependency cache
      # ============================================================

      - name: Cache SDL3 FetchContent
        uses: actions/cache@v4
        with:
          path: .cache/fetchcontent
          key: enginesim-ios-fetchcontent-v2-${{ hashFiles('cmake/EngineSimSDL.cmake', '.gitmodules') }}
          restore-keys: |
            enginesim-ios-fetchcontent-v2-
            enginesim-ios-fetchcontent-


      # ============================================================
      # Incremental Xcode / CMake cache
      #
      # IMPORTANT:
      #
      # Each commit gets a new cache key, but restore-keys pulls the
      # newest compatible build from the previous successful commit.
      #
      # This means:
      #
      #   edit sdl_audio_output.cpp
      #          ↓
      #   restore previous EngineSim build
      #          ↓
      #   compile sdl_audio_output.cpp
      #          ↓
      #   relink
      #          ↓
      #   IPA
      #
      # instead of recompiling the whole project.
      # ============================================================

      - name: Cache incremental iOS build
        uses: actions/cache@v4
        with:
          path: build/ios
          key: >-
            enginesim-ios-release-v4-
            ${{ hashFiles(
              'CMakeLists.txt',
              'ios/CMakeLists.txt',
              'cmake/**/*.cmake',
              '.gitmodules'
            ) }}-
            ${{ github.sha }}

          restore-keys: |
            enginesim-ios-release-v4-${{ hashFiles('CMakeLists.txt', 'ios/CMakeLists.txt', 'cmake/**/*.cmake', '.gitmodules') }}-
            enginesim-ios-release-v4-


      # ============================================================
      # Build tools
      # ============================================================

      - name: Prepare script compiler tools
        run: |
          if ! brew list bison >/dev/null 2>&1; then
            brew install bison
          fi

          if ! brew list flex >/dev/null 2>&1; then
            brew install flex
          fi

          echo "/opt/homebrew/opt/bison/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/flex/bin" >> "$GITHUB_PATH"

          echo "Bison:"
          /opt/homebrew/opt/bison/bin/bison --version | head -n 1

          echo "Flex:"
          /opt/homebrew/opt/flex/bin/flex --version


      # ============================================================
      # Sanity check
      # ============================================================

      - name: Sanity check
        run: |
          test -f dependencies/submodules/simple-2d-constraint-solver/CMakeLists.txt
          test -f dependencies/submodules/csv-io/CMakeLists.txt
          test -f dependencies/submodules/piranha/CMakeLists.txt

          test -f assets/main.mr
          test -f assets/fonts/slkscr.ttf
          test -f assets/authored_meshes.obj

          test -f assets/shaders/engine_sim.vertex.msl
          test -f assets/shaders/engine_sim.fragment.msl

          test -f ios/Assets.xcassets/AppIcon.appiconset/AppIcon.png

          echo "EngineSim source tree ready."


      # ============================================================
      # Configure
      #
      # DO NOT DELETE BUILD_DIR.
      #
      # CMake is intentionally run over the restored build tree.
      # It will update the Xcode project if necessary while keeping
      # valid object files from the previous build.
      # ============================================================

      - name: Configure incremental iOS build
        run: |
          mkdir -p "$BUILD_DIR"

          cmake \
            -S ios \
            -B "$BUILD_DIR" \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DFETCHCONTENT_BASE_DIR="$FETCHCONTENT_DIR" \
            -DENGINE_SIM_FETCH_SDL3=ON \
            -DENGINE_SIM_BUILD_SCRIPTING=ON \
            -DBUILD_SHARED_LIBS=OFF


      # ============================================================
      # Release build
      #
      # Let the runner use all available CPU cores.
      # ============================================================

      - name: Build Release incrementally
        run: |
          JOBS="$(sysctl -n hw.ncpu)"

          echo "Building with $JOBS parallel jobs."

          cmake \
            --build "$BUILD_DIR" \
            --config Release \
            --target EngineSimIOS \
            --parallel "$JOBS" \
            -- \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO


      # ============================================================
      # Locate app
      # ============================================================

      - name: Locate app
        run: |
          APP_PATH="$(
            find "$BUILD_DIR" \
              -type d \
              -path '*Release-iphoneos*' \
              -name 'EngineSim.app' \
              | head -n 1
          )"

          if [ -z "$APP_PATH" ]; then
            APP_PATH="$(
              find "$BUILD_DIR" \
                -type d \
                -name 'EngineSim.app' \
                | head -n 1
            )"
          fi

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: EngineSim.app was not generated."
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

          echo "EngineSim.app:"
          echo "$APP_PATH"


      # ============================================================
      # Lightweight validation
      #
      # We don't need to repeatedly crawl the entire build tree
      # and run nm against the whole executable on every iteration.
      # The build/link succeeding already proves most of that.
      # ============================================================

      - name: Validate iPhone build
        run: |
          EXECUTABLE="$APP_PATH/EngineSim"

          test -f "$EXECUTABLE"

          echo "Executable:"
          file "$EXECUTABLE"

          ARCH="$(lipo -info "$EXECUTABLE")"
          echo "$ARCH"

          if ! echo "$ARCH" | grep -q arm64; then
            echo "ERROR: EngineSim executable is not arm64."
            exit 1
          fi

          test -f "$APP_PATH/assets/main.mr"
          test -f "$APP_PATH/assets/fonts/slkscr.ttf"
          test -f "$APP_PATH/assets/authored_meshes.obj"
          test -f "$APP_PATH/assets/shaders/engine_sim.vertex.msl"
          test -f "$APP_PATH/assets/shaders/engine_sim.fragment.msl"

          echo
          echo "Release ARM64 EngineSim.app validated."


      # ============================================================
      # IPA
      # ============================================================

      - name: Package IPA
        run: |
          rm -rf artifacts

          mkdir -p artifacts/Payload

          cp -R \
            "$APP_PATH" \
            artifacts/Payload/

          cat > artifacts/BUILD_INFO.txt <<'EOF'
          EngineSim iOS
          =============

          Platform:
          iPhoneOS

          Architecture:
          arm64

          Configuration:
          Release

          Build mode:
          Incremental cached Release

          Real EngineSim application:
          enabled

          EngineSim scripting:
          enabled

          EngineSim assets:
          bundled

          SDL GPU renderer:
          enabled

          Metal:
          enabled

          SDL audio:
          enabled

          Touch:
          enabled

          App icon:
          enabled

          Signing:
          disabled
          EOF

          cd artifacts

          zip \
            -qr \
            EngineSim-iOS-Release-unsigned.ipa \
            Payload \
            BUILD_INFO.txt


      # ============================================================
      # Upload
      # ============================================================

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: engine-sim-ios-release
          path: |
            artifacts/EngineSim-iOS-Release-unsigned.ipa
            artifacts/BUILD_INFO.txt
          if-no-files-found: error
          compression-level: 0
