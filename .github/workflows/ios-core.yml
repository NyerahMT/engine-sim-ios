name: EngineSim iOS

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-sim-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: EngineSim iPhone App Store
    runs-on: macos-15

    env:
      BUILD_DIR: build/ios
      FETCHCONTENT_DIR: ${{ github.workspace }}/.cache/fetchcontent
      BUNDLE_ID: com.nyerahmt.enginesimulator
      MARKETING_VERSION: 0.1.0

      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Cache SDL3 FetchContent
        uses: actions/cache@v4
        with:
          path: .cache/fetchcontent
          key: enginesim-ios-fetchcontent-v2-${{ hashFiles('cmake/EngineSimSDL.cmake', '.gitmodules') }}
          restore-keys: |
            enginesim-ios-fetchcontent-v2-
            enginesim-ios-fetchcontent-

      - name: Cache incremental iOS build
        uses: actions/cache@v4
        with:
          path: build/ios
          key: >-
            enginesim-ios-appstore-v1-
            ${{ hashFiles(
              'CMakeLists.txt',
              'ios/CMakeLists.txt',
              'cmake/**/*.cmake',
              '.gitmodules'
            ) }}-
            ${{ github.sha }}
          restore-keys: |
            enginesim-ios-appstore-v1-${{ hashFiles('CMakeLists.txt', 'ios/CMakeLists.txt', 'cmake/**/*.cmake', '.gitmodules') }}-
            enginesim-ios-appstore-v1-

      - name: Prepare script compiler tools
        run: |
          if ! brew list bison >/dev/null 2>&1; then
            brew install bison
          fi

          if ! brew list flex >/dev/null 2>&1; then
            brew install flex
          fi

          echo "/opt/homebrew/opt/bison/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/flex/bin" >> "$GITHUB_PATH"

          /opt/homebrew/opt/bison/bin/bison --version | head -n 1
          /opt/homebrew/opt/flex/bin/flex --version

      - name: Sanity check
        run: |
          test -f dependencies/submodules/simple-2d-constraint-solver/CMakeLists.txt
          test -f dependencies/submodules/csv-io/CMakeLists.txt
          test -f dependencies/submodules/piranha/CMakeLists.txt

          test -f assets/main.mr
          test -f assets/fonts/slkscr.ttf
          test -f assets/authored_meshes.obj
          test -f assets/shaders/engine_sim.vertex.msl
          test -f assets/shaders/engine_sim.fragment.msl
          test -f ios/Assets.xcassets/AppIcon.appiconset/AppIcon.png

          echo "EngineSim source tree ready."

      - name: Configure incremental iOS build
        run: |
          mkdir -p "$BUILD_DIR"

          cmake \
            -S ios \
            -B "$BUILD_DIR" \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DFETCHCONTENT_BASE_DIR="$FETCHCONTENT_DIR" \
            -DENGINE_SIM_FETCH_SDL3=ON \
            -DENGINE_SIM_BUILD_SCRIPTING=ON \
            -DBUILD_SHARED_LIBS=OFF

      - name: Build unsigned Release
        run: |
          JOBS="$(sysctl -n hw.ncpu)"

          cmake \
            --build "$BUILD_DIR" \
            --config Release \
            --target EngineSimIOS \
            --parallel "$JOBS" \
            -- \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Locate app
        run: |
          APP_PATH="$(
            find "$BUILD_DIR" \
              -type d \
              -path '*Release-iphoneos*' \
              -name 'EngineSim.app' \
              | head -n 1
          )"

          if [ -z "$APP_PATH" ]; then
            APP_PATH="$(
              find "$BUILD_DIR" \
                -type d \
                -name 'EngineSim.app' \
                | head -n 1
            )"
          fi

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: EngineSim.app was not generated."
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "EngineSim.app: $APP_PATH"

      - name: Apply App Store bundle identity
        run: |
          INFO_PLIST="$APP_PATH/Info.plist"

          test -f "$INFO_PLIST"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleIdentifier $BUNDLE_ID" \
            "$INFO_PLIST"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleShortVersionString $MARKETING_VERSION" \
            "$INFO_PLIST"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" \
            "$INFO_PLIST"

          echo "Bundle ID:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$INFO_PLIST"

          echo "Version:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$INFO_PLIST"

          echo "Build:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$INFO_PLIST"

      - name: Install Apple signing identity
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/EngineSim.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          ENTITLEMENTS_PATH="$RUNNER_TEMP/entitlements.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/engine-sim-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          printf '%s' "$BUILD_CERTIFICATE_BASE64" \
            | base64 --decode \
            > "$CERTIFICATE_PATH"

          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" \
            | base64 --decode \
            > "$PROFILE_PATH"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security import \
            "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH"

          security cms \
            -D \
            -i "$PROFILE_PATH" \
            > "$PROFILE_PLIST"

          PROFILE_UUID="$(
            /usr/libexec/PlistBuddy \
              -c "Print :UUID" \
              "$PROFILE_PLIST"
          )"

          PROFILE_NAME="$(
            /usr/libexec/PlistBuddy \
              -c "Print :Name" \
              "$PROFILE_PLIST"
          )"

          PROFILE_APP_ID="$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:application-identifier" \
              "$PROFILE_PLIST"
          )"

          EXPECTED_SUFFIX=".$BUNDLE_ID"

          if [[ "$PROFILE_APP_ID" != *"$EXPECTED_SUFFIX" ]]; then
            echo "ERROR: Provisioning profile application identifier is:"
            echo "$PROFILE_APP_ID"
            echo "Expected it to end with:"
            echo "$EXPECTED_SUFFIX"
            exit 1
          fi

          mkdir -p \
            "$HOME/Library/MobileDevice/Provisioning Profiles"

          cp \
            "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          plutil \
            -extract Entitlements \
            xml1 \
            -o "$ENTITLEMENTS_PATH" \
            "$PROFILE_PLIST"

          SIGNING_IDENTITY="$(
            security find-identity \
              -v \
              -p codesigning \
              "$KEYCHAIN_PATH" \
              | awk -F '"' '/Apple Distribution/ {print $2; exit}'
          )"

          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "ERROR: Apple Distribution signing identity not found."
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
            exit 1
          fi

          echo "Provisioning profile: $PROFILE_NAME"
          echo "Profile UUID: $PROFILE_UUID"
          echo "Application identifier: $PROFILE_APP_ID"
          echo "Signing identity: $SIGNING_IDENTITY"

          echo "PROFILE_PATH=$PROFILE_PATH" >> "$GITHUB_ENV"
          echo "ENTITLEMENTS_PATH=$ENTITLEMENTS_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Sign Engine Simulator
        run: |
          set -euo pipefail

          cp \
            "$PROFILE_PATH" \
            "$APP_PATH/embedded.mobileprovision"

          if [ -d "$APP_PATH/Frameworks" ]; then
            find "$APP_PATH/Frameworks" \
              -type d \
              -name '*.framework' \
              -print0 \
              | while IFS= read -r -d '' FRAMEWORK; do
                  echo "Signing framework: $FRAMEWORK"
                  codesign \
                    --force \
                    --sign "$SIGNING_IDENTITY" \
                    --keychain "$KEYCHAIN_PATH" \
                    "$FRAMEWORK"
                done

            find "$APP_PATH/Frameworks" \
              -type f \
              -name '*.dylib' \
              -print0 \
              | while IFS= read -r -d '' DYLIB; do
                  echo "Signing dylib: $DYLIB"
                  codesign \
                    --force \
                    --sign "$SIGNING_IDENTITY" \
                    --keychain "$KEYCHAIN_PATH" \
                    "$DYLIB"
                done
          fi

          codesign \
            --force \
            --sign "$SIGNING_IDENTITY" \
            --keychain "$KEYCHAIN_PATH" \
            --entitlements "$ENTITLEMENTS_PATH" \
            --generate-entitlement-der \
            "$APP_PATH"

      - name: Verify signed app
        run: |
          set -euo pipefail

          EXECUTABLE="$APP_PATH/EngineSim"

          test -f "$EXECUTABLE"
          test -f "$APP_PATH/embedded.mobileprovision"

          file "$EXECUTABLE"

          ARCH="$(lipo -info "$EXECUTABLE")"
          echo "$ARCH"

          if ! echo "$ARCH" | grep -q arm64; then
            echo "ERROR: EngineSim executable is not arm64."
            exit 1
          fi

          FINAL_BUNDLE_ID="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleIdentifier" \
              "$APP_PATH/Info.plist"
          )"

          if [ "$FINAL_BUNDLE_ID" != "$BUNDLE_ID" ]; then
            echo "ERROR: Final bundle ID is $FINAL_BUNDLE_ID"
            exit 1
          fi

          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=2 \
            "$APP_PATH"

          echo
          echo "Signing details:"
          codesign \
            -d \
            --verbose=4 \
            "$APP_PATH" \
            2>&1 \
            | grep -E 'Identifier=|TeamIdentifier=|Authority=' \
            || true

          echo
          echo "Signed Engine Simulator validated."

      - name: Package App Store IPA
        run: |
          rm -rf artifacts
          mkdir -p artifacts/Payload

          cp -R \
            "$APP_PATH" \
            artifacts/Payload/

          cd artifacts

          zip \
            -qry \
            EngineSim-iOS-AppStore.ipa \
            Payload

          echo "Created:"
          ls -lh EngineSim-iOS-AppStore.ipa

      - name: Upload App Store IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: engine-sim-ios-appstore
          path: artifacts/EngineSim-iOS-AppStore.ipa
          if-no-files-found: error
          compression-level: 0
