name: iOS App Build

on:
  push:
    branches:
      - master
      - main

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:

  ios-app:

    name: EngineSim iPhone App

    runs-on: macos-15

    steps:

      - name: Checkout EngineSim
        uses: actions/checkout@v4
        with:
          submodules: recursive


      - name: Show Apple toolchain
        run: |
          echo "================================"
          echo "macOS"
          echo "================================"

          sw_vers

          echo
          echo "================================"
          echo "Xcode"
          echo "================================"

          xcodebuild -version

          echo
          echo "================================"
          echo "iPhoneOS SDK"
          echo "================================"

          xcrun --sdk iphoneos --show-sdk-version

          xcrun --sdk iphoneos --show-sdk-path

          echo
          echo "================================"
          echo "CMake"
          echo "================================"

          cmake --version


      - name: Verify EngineSim submodules
        run: |
          test -f \
            dependencies/submodules/simple-2d-constraint-solver/CMakeLists.txt

          test -f \
            dependencies/submodules/csv-io/CMakeLists.txt

          test -f \
            dependencies/submodules/piranha/CMakeLists.txt

          echo "EngineSim dependencies are present."


      - name: Configure native iOS application
        run: |
          rm -rf build/ios-app

          cmake \
            -S ios \
            -B build/ios-app \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY


      - name: Build EngineSim iOS application
        run: |
          cmake \
            --build build/ios-app \
            --config Release \
            --target EngineSimIOS \
            -- \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO


      - name: Find generated app
        run: |
          echo "Searching for EngineSim.app..."

          find build/ios-app \
            -type d \
            -name "EngineSim.app" \
            -print

          APP_PATH="$(
            find build/ios-app \
              -type d \
              -name "EngineSim.app" \
              | head -n 1
          )"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: EngineSim.app was not generated."

            echo
            echo "Available .app directories:"

            find build/ios-app \
              -type d \
              -name "*.app" \
              -print

            exit 1
          fi

          echo
          echo "Generated application:"
          echo "$APP_PATH"


      - name: Inspect application bundle
        run: |
          APP_PATH="$(
            find build/ios-app \
              -type d \
              -name "EngineSim.app" \
              | head -n 1
          )"

          EXECUTABLE="$APP_PATH/EngineSim"

          echo "================================"
          echo "Application bundle"
          echo "================================"

          ls -la "$APP_PATH"

          echo
          echo "================================"
          echo "Executable"
          echo "================================"

          file "$EXECUTABLE"

          echo
          echo "================================"
          echo "Architectures"
          echo "================================"

          lipo -info "$EXECUTABLE"

          echo
          echo "================================"
          echo "Bundle identifier"
          echo "================================"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP_PATH/Info.plist"

          echo
          echo "================================"
          echo "Minimum iOS version"
          echo "================================"

          /usr/libexec/PlistBuddy \
            -c "Print :MinimumOSVersion" \
            "$APP_PATH/Info.plist"


      - name: Validate arm64 iPhone executable
        run: |
          APP_PATH="$(
            find build/ios-app \
              -type d \
              -name "EngineSim.app" \
              | head -n 1
          )"

          EXECUTABLE="$APP_PATH/EngineSim"

          if [ ! -f "$EXECUTABLE" ]; then
            echo "ERROR: EngineSim executable does not exist."
            exit 1
          fi

          ARCH_INFO="$(lipo -info "$EXECUTABLE")"

          echo "$ARCH_INFO"

          if ! echo "$ARCH_INFO" | grep -q "arm64"; then
            echo
            echo "ERROR:"
            echo "EngineSim executable is not arm64."

            exit 1
          fi

          echo
          echo "SUCCESS:"
          echo "Native EngineSim iOS application compiled for arm64."


      - name: Verify EngineSim core linkage
        run: |
          echo "Searching Xcode link command for EngineSim core..."

          grep \
            -R \
            "engine-sim-core" \
            build/ios-app \
            --include="*.LinkFileList" \
            --include="*.xcbuilddata" \
            --include="*.txt" \
            --include="*.pbxproj" \
            2>/dev/null \
            | head -n 30 \
            || true

          echo
          echo "EngineSimIOS explicitly links engine-sim::core through CMake."


      - name: Package unsigned iOS app
        run: |
          rm -rf artifacts

          mkdir -p artifacts/Payload

          APP_PATH="$(
            find build/ios-app \
              -type d \
              -name "EngineSim.app" \
              | head -n 1
          )"

          cp -R \
            "$APP_PATH" \
            artifacts/Payload/

          cat > artifacts/BUILD_INFO.txt <<EOF
          EngineSim iOS
          =============

          Milestone:
          First native iOS application bundle

          Platform:
          iPhoneOS

          Architecture:
          arm64

          Configuration:
          Release

          EngineSim core:
          linked

          UIKit host:
          enabled

          SDL:
          not yet enabled

          EngineSim renderer:
          not yet enabled

          EngineSim scripting:
          not yet enabled

          EngineSim audio output:
          not yet enabled

          Code signing:
          disabled

          Expected launch result:
          Native EngineSim milestone screen
          EOF

          cd artifacts

          zip \
            -r \
            EngineSim-iOS-unsigned.ipa \
            Payload \
            BUILD_INFO.txt


      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: engine-sim-ios-app-arm64
          path: |
            artifacts/EngineSim-iOS-unsigned.ipa
            artifacts/BUILD_INFO.txt
          if-no-files-found: error
