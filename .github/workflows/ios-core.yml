name: EngineSim iOS

on:
  push:
    branches:
      - master
      - main

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-sim-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:

  ios:

    name: EngineSim iPhone

    runs-on: macos-15

    env:
      BUILD_DIR: build/ios

      FETCHCONTENT_DIR: ${{ github.workspace }}/.cache/fetchcontent

      HOMEBREW_NO_AUTO_UPDATE: 1

      HOMEBREW_NO_INSTALL_CLEANUP: 1

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1


      - name: Cache SDL3
        uses: actions/cache@v4
        with:
          path: .cache/fetchcontent
          key: enginesim-ios-sdl3-3.2.8
          restore-keys: |
            enginesim-ios-sdl3-


      - name: Install script compiler tools
        run: |
          brew list bison >/dev/null 2>&1 \
            || brew install bison

          brew list flex >/dev/null 2>&1 \
            || brew install flex

          echo "Bison:"
          /opt/homebrew/opt/bison/bin/bison \
            --version \
            | head -n 1

          echo

          echo "Flex:"
          /opt/homebrew/opt/flex/bin/flex \
            --version


      - name: Sanity check
        run: |
          test -f \
            dependencies/submodules/simple-2d-constraint-solver/CMakeLists.txt

          test -f \
            dependencies/submodules/csv-io/CMakeLists.txt

          test -f \
            dependencies/submodules/piranha/CMakeLists.txt

          test -f \
            assets/main.mr

          test -f \
            assets/fonts/slkscr.ttf

          test -f \
            assets/authored_meshes.obj

          test -f \
            assets/shaders/engine_sim.vertex.msl

          test -f \
            assets/shaders/engine_sim.fragment.msl

          test -f \
            ios/Assets.xcassets/AppIcon.appiconset/AppIcon.png

          echo \
            "Real EngineSim source tree ready."


      - name: Configure
        run: |
          rm -rf "$BUILD_DIR"

          cmake \
            -S ios \
            -B "$BUILD_DIR" \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DFETCHCONTENT_BASE_DIR="$FETCHCONTENT_DIR" \
            -DENGINE_SIM_FETCH_SDL3=ON \
            -DENGINE_SIM_BUILD_SCRIPTING=ON \
            -DBUILD_SHARED_LIBS=OFF


      - name: Build
        run: |
          cmake \
            --build "$BUILD_DIR" \
            --config Debug \
            --target EngineSimIOS \
            --parallel 3 \
            -- \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO


      - name: Locate app
        run: |
          APP_PATH="$(
            find "$BUILD_DIR" \
              -type d \
              -name 'EngineSim.app' \
              | head -n 1
          )"

          if [ -z "$APP_PATH" ]; then

            echo \
              "ERROR: EngineSim.app was not generated."

            exit 1

          fi

          echo \
            "APP_PATH=$APP_PATH" \
            >> "$GITHUB_ENV"

          echo \
            "EngineSim.app: $APP_PATH"


      - name: Validate real EngineSim build
        run: |
          EXECUTABLE="$APP_PATH/EngineSim"

          test -f \
            "$EXECUTABLE"

          echo \
            "================================"

          echo \
            "Executable"

          echo \
            "================================"

          file \
            "$EXECUTABLE"

          ARCH="$(
            lipo \
              -info \
              "$EXECUTABLE"
          )"

          echo \
            "$ARCH"

          if ! echo "$ARCH" \
            | grep -q arm64
          then

            echo \
              "ERROR: executable is not arm64."

            exit 1

          fi


          echo
          echo \
            "================================"

          echo \
            "Bundled EngineSim"

          echo \
            "================================"

          test -f \
            "$APP_PATH/assets/main.mr"

          test -f \
            "$APP_PATH/assets/fonts/slkscr.ttf"

          test -f \
            "$APP_PATH/assets/authored_meshes.obj"

          test -f \
            "$APP_PATH/assets/shaders/engine_sim.vertex.msl"

          test -f \
            "$APP_PATH/assets/shaders/engine_sim.fragment.msl"

          echo \
            "EngineSim runtime assets bundled."


          echo
          echo \
            "================================"

          echo \
            "Scripting"

          echo \
            "================================"

          SCRIPTING_LIBRARY="$(
            find "$BUILD_DIR" \
              -type f \
              -name 'libengine-sim-scripting.a' \
              | head -n 1
          )"

          if [ -z "$SCRIPTING_LIBRARY" ]; then

            echo \
              "ERROR: scripting library missing."

            exit 1

          fi

          lipo \
            -info \
            "$SCRIPTING_LIBRARY"


          echo
          echo \
            "================================"

          echo \
            "Visualization"

          echo \
            "================================"

          VIS_LIBRARY="$(
            find "$BUILD_DIR" \
              -type f \
              -name 'libengine-sim-visualization.a' \
              | head -n 1
          )"

          if [ -z "$VIS_LIBRARY" ]; then

            echo \
              "ERROR: visualization library missing."

            exit 1

          fi

          lipo \
            -info \
            "$VIS_LIBRARY"


          echo
          echo \
            "================================"

          echo \
            "Linked EngineSim symbols"

          echo \
            "================================"

          nm \
            "$EXECUTABLE" \
            | grep \
              -E \
              'EngineSimApplication|SdlGpuRenderer|SdlAudioOutput' \
            | head -n 30 \
            || true


          echo
          echo \
            "REAL ENGINESIM iOS BUILD COMPLETE."


      - name: Package IPA
        run: |
          rm -rf \
            artifacts

          mkdir -p \
            artifacts/Payload

          cp -R \
            "$APP_PATH" \
            artifacts/Payload/

          cat \
            > artifacts/BUILD_INFO.txt \
            <<'EOF'

          EngineSim iOS
          =============

          Milestone:
          Real EngineSim application

          Platform:
          iPhoneOS arm64

          Real EngineSim application:
          enabled

          EngineSim scripting:
          enabled

          EngineSim assets:
          bundled

          SDL GPU renderer:
          enabled

          Metal shaders:
          bundled

          Touch input:
          enabled

          SDL audio output:
          enabled

          App icon:
          enabled

          Signing:
          disabled

          Expected result:
          Actual Engine Simulator
          interface and simulation.
          EOF

          cd \
            artifacts

          zip \
            -qr \
            EngineSim-iOS-unsigned.ipa \
            Payload \
            BUILD_INFO.txt


      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: engine-sim-ios-real
          path: |
            artifacts/EngineSim-iOS-unsigned.ipa
            artifacts/BUILD_INFO.txt
          if-no-files-found: error
          compression-level: 1
