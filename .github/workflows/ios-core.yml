name: iOS SDL3 Graphics Build

on:
  push:
    branches:
      - master
      - main

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:

  ios-sdl:

    name: EngineSim SDL3 iPhone Build

    runs-on: macos-15

    steps:

      - name: Checkout EngineSim
        uses: actions/checkout@v4
        with:
          submodules: recursive


      - name: Show build environment
        run: |
          echo "================================"
          echo "macOS"
          echo "================================"

          sw_vers

          echo
          echo "================================"
          echo "Xcode"
          echo "================================"

          xcodebuild -version

          echo
          echo "================================"
          echo "iPhoneOS SDK"
          echo "================================"

          xcrun \
            --sdk iphoneos \
            --show-sdk-version

          echo
          echo "================================"
          echo "CMake"
          echo "================================"

          cmake --version


      - name: Verify EngineSim dependencies
        run: |
          test -f \
            dependencies/submodules/simple-2d-constraint-solver/CMakeLists.txt

          test -f \
            dependencies/submodules/csv-io/CMakeLists.txt

          test -f \
            dependencies/submodules/piranha/CMakeLists.txt

          echo \
            "EngineSim submodules are present."


      - name: Verify app icon source
        run: |
          ICON="ios/Assets.xcassets/AppIcon.appiconset/AppIcon.png"

          CONTENTS="ios/Assets.xcassets/AppIcon.appiconset/Contents.json"

          if [ ! -f "$ICON" ]; then
            echo "ERROR: AppIcon.png is missing."
            exit 1
          fi

          if [ ! -f "$CONTENTS" ]; then
            echo "ERROR: AppIcon Contents.json is missing."
            exit 1
          fi

          echo "App icon source exists."

          file "$ICON"


      - name: Configure SDL3 iOS host
        run: |
          rm -rf build/ios-sdl

          cmake \
            -S ios \
            -B build/ios-sdl \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DENGINE_SIM_FETCH_SDL3=ON \
            -DBUILD_SHARED_LIBS=OFF


      - name: Build EngineSim visualization for iOS
        run: |
          cmake \
            --build build/ios-sdl \
            --config Release \
            --target engine-sim-visualization \
            -- \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO


      - name: Build SDL3 EngineSim application
        run: |
          cmake \
            --build build/ios-sdl \
            --config Release \
            --target EngineSimIOS \
            -- \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO


      - name: Find application
        run: |
          APP_PATH="$(
            find build/ios-sdl \
              -type d \
              -name 'EngineSim.app' \
              | head -n 1
          )"

          if [ -z "$APP_PATH" ]; then

            echo \
              "ERROR: EngineSim.app not generated."

            find build/ios-sdl \
              -type d \
              -name '*.app' \
              -print

            exit 1

          fi

          echo \
            "EngineSim app: $APP_PATH"


      - name: Inspect executable
        run: |
          APP_PATH="$(
            find build/ios-sdl \
              -type d \
              -name 'EngineSim.app' \
              | head -n 1
          )"

          EXECUTABLE="$APP_PATH/EngineSim"

          echo "================================"
          echo "Executable"
          echo "================================"

          file "$EXECUTABLE"

          echo

          lipo \
            -info \
            "$EXECUTABLE"

          echo
          echo "================================"
          echo "Application bundle"
          echo "================================"

          ls \
            -lah \
            "$APP_PATH"


      - name: Verify compiled app icon
        run: |
          APP_PATH="$(
            find build/ios-sdl \
              -type d \
              -name 'EngineSim.app' \
              | head -n 1
          )"

          echo "Checking compiled asset catalog..."

          if [ ! -f "$APP_PATH/Assets.car" ]; then
            echo
            echo "ERROR:"
            echo "Assets.car was not generated."
            echo "The application icon was not compiled."
            exit 1
          fi

          echo
          echo "Compiled asset catalog:"
          ls -lh "$APP_PATH/Assets.car"

          echo
          echo "Checking Info.plist icon metadata..."

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIcons" \
            "$APP_PATH/Info.plist" \
            || true

          echo
          echo "SUCCESS:"
          echo "iOS application asset catalog is bundled."


      - name: Inspect SDL linkage
        run: |
          APP_PATH="$(
            find build/ios-sdl \
              -type d \
              -name 'EngineSim.app' \
              | head -n 1
          )"

          EXECUTABLE="$APP_PATH/EngineSim"

          echo \
            "Looking for SDL symbols..."

          nm \
            "$EXECUTABLE" \
            | grep \
                -E \
                'SDL_(Init|CreateWindow|CreateRenderer|RenderPresent)' \
            | head -n 40 \
            || true


      - name: Verify visualization build
        run: |
          echo \
            "Searching for visualization library..."

          find build/ios-sdl \
            -type f \
            -name 'libengine-sim-visualization.a' \
            -print

          VIS_LIBRARY="$(
            find build/ios-sdl \
              -type f \
              -name 'libengine-sim-visualization.a' \
              | head -n 1
          )"

          if [ -z "$VIS_LIBRARY" ]; then

            echo \
              "ERROR: visualization library was not built."

            exit 1

          fi

          echo
          echo \
            "Visualization architecture:"

          lipo \
            -info \
            "$VIS_LIBRARY"


      - name: Create IPA payload
        run: |
          rm \
            -rf \
            artifacts

          mkdir \
            -p \
            artifacts/Payload

          APP_PATH="$(
            find build/ios-sdl \
              -type d \
              -name 'EngineSim.app' \
              | head -n 1
          )"

          cp \
            -R \
            "$APP_PATH" \
            artifacts/Payload/

          cat \
            > artifacts/BUILD_INFO.txt \
            <<'EOF'

          EngineSim iOS
          =============

          Platform:
          iPhoneOS

          Architecture:
          arm64

          SDL3:
          enabled

          SDL graphics:
          enabled

          Touch input:
          enabled

          EngineSim core:
          enabled

          EngineSim visualization:
          compiled

          App icon:
          compiled into asset catalog

          Real EngineSim renderer:
          in progress

          Audio:
          in progress

          Signing:
          disabled
          EOF

          cd \
            artifacts

          zip \
            -r \
            EngineSim-SDL3-iOS-unsigned.ipa \
            Payload \
            BUILD_INFO.txt


      - name: Upload SDL3 IPA
        uses: actions/upload-artifact@v4
        with:
          name: engine-sim-ios-sdl3-arm64
          path: |
            artifacts/EngineSim-SDL3-iOS-unsigned.ipa
            artifacts/BUILD_INFO.txt
          if-no-files-found: error
