name: Fix Slow Motion Audio

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix time control UI and slow motion simulation
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          # ============================================================
          # 1. REMOVE THE INSET BOX AROUND 1 / SPEED
          # ============================================================

          p = Path("src/performance_cluster.cpp")
          s = p.read_text()

          old = """    const Bounds simulationSpeedGaugeBounds =
                  simulationSpeedCell
                      .horizontalSplit(
                          0.18f,
                          0.82f);

              const Bounds simulationSpeedLeft =
          """

          new = """    /*
               * Keep the gauge itself at its original full-cell size.
               * The left/right chevrons are overlays, not separate
               * framed sub-controls.
               */
              const Bounds simulationSpeedGaugeBounds =
                  simulationSpeedCell;

              const Bounds simulationSpeedLeft =
          """

          if old not in s:
              raise RuntimeError(
                  "Could not find simulation speed gauge bounds block"
              )

          s = s.replace(old, new, 1)
          p.write_text(s)

          # ============================================================
          # 2. HIGH-FIDELITY SLOW MOTION
          #
          # OLD:
          #   fewer physics samples per real second
          #   synthesizer input rate falls to 1000 / 100 / 10 Hz
          #
          # NEW:
          #   keep normal sampling cadence
          #   shrink simulated dt instead
          #
          # This preserves audio/simulation resolution while slowing
          # the actual passage of simulated time.
          # ============================================================

          p = Path("src/simulator.cpp")
          s = p.read_text()

          old = """    m_synthesizer.setInputSampleRate(m_simulationFrequency * m_simulationSpeed);

              const double timestep = getTimestep();
              m_steps = (int)std::round((dt * m_simulationSpeed) / timestep);
          """

          new = """    /*
               * Keep the synthesizer sampling clock fixed.
               *
               * Simulation speed is implemented by scaling the amount
               * of simulated time advanced by every physics sample,
               * rather than by throwing samples away.
               *
               * This is especially important for slow motion:
               *
               *     1 / 10   -> still 10 kHz sampling
               *     1 / 100  -> still 10 kHz sampling
               *     1 / 1000 -> still 10 kHz sampling
               *
               * Only the simulated timestep changes.
               */
              m_synthesizer.setInputSampleRate(
                  m_simulationFrequency);

              const double timestep =
                  getTimestep();

              m_steps =
                  static_cast<int>(
                      std::round(
                          dt
                          / timestep));
          """

          if old not in s:
              raise RuntimeError(
                  "Could not find Simulator::startFrame speed block"
              )

          s = s.replace(old, new, 1)

          old = """    const double timestep = getTimestep();
              m_system->process(timestep, 1);

              m_engine->update(timestep);
              m_vehicle->update(timestep);
              m_transmission->update(timestep);

              updateFilteredEngineSpeed(timestep);
          """

          new = """    /*
               * Advance less simulated time per sample when running
               * in slow motion while retaining full sampling density.
               */
              const double timestep =
                  getTimestep()
                  * m_simulationSpeed;

              m_system->process(
                  timestep,
                  1);

              m_engine->update(
                  timestep);

              m_vehicle->update(
                  timestep);

              m_transmission->update(
                  timestep);

              updateFilteredEngineSpeed(
                  timestep);
          """

          if old not in s:
              raise RuntimeError(
                  "Could not find Simulator::simulateStep timestep block"
              )

          s = s.replace(old, new, 1)

          p.write_text(s)

          print("Slow-motion audio/simulation fix applied.")
          PY

      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail

          grep -q "m_synthesizer.setInputSampleRate(" src/simulator.cpp
          grep -q "getTimestep()" src/simulator.cpp
          grep -q "m_simulationSpeed" src/simulator.cpp
          grep -q "simulationSpeedGaugeBounds" src/performance_cluster.cpp

          echo "Verification passed."

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            src/simulator.cpp \
            src/performance_cluster.cpp

          git commit \
            -m "Improve slow motion simulation and audio fidelity"

          git push
