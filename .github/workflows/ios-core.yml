name: Fast iOS Build

on:
  push:
    branches:
      - master
      - main

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

#
# When we push a new fix while an old build is still running,
# kill the obsolete build immediately.
#
concurrency:
  group: engine-sim-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:

  ios:

    name: EngineSim iPhone

    runs-on: macos-15

    env:
      BUILD_DIR: build/ios
      FETCHCONTENT_DIR: ${{ github.workspace }}/.cache/fetchcontent

    steps:

      #
      # Shallow checkout saves some network time.
      # Recursive submodules are still required by EngineSim.
      #

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1


      #
      # SDL3 is brought in through CMake FetchContent.
      #
      # Previously every clean workflow downloaded SDL3 again.
      # This cache allows the SDL source checkout to survive
      # between GitHub Actions runs.
      #

      - name: Cache SDL3
        uses: actions/cache@v4
        with:
          path: .cache/fetchcontent
          key: enginesim-ios-sdl3-3.2.8
          restore-keys: |
            enginesim-ios-sdl3-


      #
      # Fail immediately if something fundamental is missing.
      #
      # This is intentionally tiny.
      #

      - name: Sanity check
        run: |
          test -f dependencies/submodules/simple-2d-constraint-solver/CMakeLists.txt
          test -f dependencies/submodules/csv-io/CMakeLists.txt
          test -f dependencies/submodules/piranha/CMakeLists.txt

          test -f ios/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          test -f ios/Assets.xcassets/AppIcon.appiconset/Contents.json

          echo "Source tree ready."


      #
      # Only the generated Xcode project is thrown away.
      #
      # FETCHCONTENT_DIR lives outside BUILD_DIR, so SDL survives.
      #

      - name: Configure
        run: |
          rm -rf "$BUILD_DIR"

          cmake \
            -S ios \
            -B "$BUILD_DIR" \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DFETCHCONTENT_BASE_DIR="$FETCHCONTENT_DIR" \
            -DENGINE_SIM_FETCH_SDL3=ON \
            -DBUILD_SHARED_LIBS=OFF


      #
      # ONE build invocation.
      #
      # EngineSimIOS already depends on engine-sim-visualization,
      # which depends on the lower EngineSim libraries.
      #
      # Xcode therefore constructs the entire required dependency
      # graph itself.
      #
      # Debug is deliberate during port development:
      # less compiler optimization = quicker iteration.
      #

      - name: Build
        run: |
          cmake \
            --build "$BUILD_DIR" \
            --config Debug \
            --target EngineSimIOS \
            --parallel 3 \
            -- \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO


      #
      # Find the app once and export its location for all
      # remaining steps rather than repeatedly running find.
      #

      - name: Locate app
        run: |
          APP_PATH="$(
            find "$BUILD_DIR" \
              -type d \
              -name 'EngineSim.app' \
              | head -n 1
          )"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: EngineSim.app was not generated."
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "EngineSim.app found at:"
          echo "$APP_PATH"


      #
      # Fast validation.
      #
      # We retain the checks that actually matter while developing,
      # but drop the verbose diagnostic passes.
      #

      - name: Validate
        run: |
          EXECUTABLE="$APP_PATH/EngineSim"

          test -f "$EXECUTABLE"

          echo "Executable:"
          file "$EXECUTABLE"

          ARCH="$(lipo -info "$EXECUTABLE")"
          echo "$ARCH"

          if ! echo "$ARCH" | grep -q "arm64"; then
            echo "ERROR: EngineSim is not arm64."
            exit 1
          fi

          if [ ! -f "$APP_PATH/Assets.car" ]; then
            echo "ERROR: App icon asset catalog was not compiled."
            exit 1
          fi

          VIS_LIBRARY="$(
            find "$BUILD_DIR" \
              -type f \
              -name 'libengine-sim-visualization.a' \
              | head -n 1
          )"

          if [ -z "$VIS_LIBRARY" ]; then
            echo "ERROR: EngineSim visualization was not built."
            exit 1
          fi

          echo
          echo "SUCCESS:"
          echo "arm64 executable"
          echo "SDL3 host"
          echo "EngineSim visualization"
          echo "App icon"
          echo "all present."


      #
      # Build the unsigned IPA without verbose zip output.
      #

      - name: Package IPA
        run: |
          rm -rf artifacts

          mkdir -p artifacts/Payload

          cp -R \
            "$APP_PATH" \
            artifacts/Payload/

          cat > artifacts/BUILD_INFO.txt <<'EOF'
          EngineSim iOS
          =============

          Platform: iPhoneOS
          Architecture: arm64
          Configuration: Debug

          SDL3: enabled
          Touch: enabled
          EngineSim core: enabled
          EngineSim visualization: enabled
          App icon: enabled

          Code signing: disabled
          EOF

          cd artifacts

          zip \
            -qr \
            EngineSim-iOS-unsigned.ipa \
            Payload \
            BUILD_INFO.txt


      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: engine-sim-ios
          path: |
            artifacts/EngineSim-iOS-unsigned.ipa
            artifacts/BUILD_INFO.txt
          if-no-files-found: error
          compression-level: 1
