name: Fast iOS Build

on:
  push:
    branches:
      - master
      - main

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-sim-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:

  ios:

    name: EngineSim iPhone

    runs-on: macos-15

    env:
      BUILD_DIR: build/ios
      FETCHCONTENT_DIR: ${{ github.workspace }}/.cache/fetchcontent

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1


      - name: Cache SDL3
        uses: actions/cache@v4
        with:
          path: .cache/fetchcontent
          key: enginesim-ios-sdl3-3.2.8
          restore-keys: |
            enginesim-ios-sdl3-


      - name: Sanity check
        run: |
          test -f dependencies/submodules/simple-2d-constraint-solver/CMakeLists.txt
          test -f dependencies/submodules/csv-io/CMakeLists.txt
          test -f dependencies/submodules/piranha/CMakeLists.txt

          test -f ios/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          test -f ios/Assets.xcassets/AppIcon.appiconset/Contents.json

          echo "Source tree ready."


      - name: Configure
        run: |
          rm -rf "$BUILD_DIR"

          cmake \
            -S ios \
            -B "$BUILD_DIR" \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DFETCHCONTENT_BASE_DIR="$FETCHCONTENT_DIR" \
            -DENGINE_SIM_FETCH_SDL3=ON \
            -DBUILD_SHARED_LIBS=OFF


      - name: Build
        run: |
          cmake \
            --build "$BUILD_DIR" \
            --config Debug \
            --target EngineSimIOS \
            --parallel 3 \
            -- \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO


      - name: Locate app
        run: |
          APP_PATH="$(
            find "$BUILD_DIR" \
              -type d \
              -name 'EngineSim.app' \
              | head -n 1
          )"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: EngineSim.app was not generated."
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

          echo "EngineSim.app:"
          echo "$APP_PATH"

          echo
          echo "Bundle contents:"
          find "$APP_PATH" \
            -maxdepth 2 \
            -type f \
            -print


      - name: Validate
        run: |
          EXECUTABLE="$APP_PATH/EngineSim"

          if [ ! -f "$EXECUTABLE" ]; then
            echo "ERROR: EngineSim executable missing."
            exit 1
          fi

          echo "================================"
          echo "Executable"
          echo "================================"

          file "$EXECUTABLE"

          ARCH="$(lipo -info "$EXECUTABLE")"

          echo "$ARCH"

          if ! echo "$ARCH" | grep -q "arm64"; then
            echo "ERROR: EngineSim is not arm64."
            exit 1
          fi


          echo
          echo "================================"
          echo "EngineSim visualization"
          echo "================================"

          VIS_LIBRARY="$(
            find "$BUILD_DIR" \
              -type f \
              -name 'libengine-sim-visualization.a' \
              | head -n 1
          )"

          if [ -z "$VIS_LIBRARY" ]; then
            echo "ERROR: EngineSim visualization was not built."
            exit 1
          fi

          echo "$VIS_LIBRARY"

          lipo -info "$VIS_LIBRARY"


          echo
          echo "================================"
          echo "App icon"
          echo "================================"

          echo "Icon-related files in bundle:"

          find "$APP_PATH" \
            -type f \
            \( \
              -iname '*AppIcon*' \
              -o \
              -iname '*Icon*.png' \
              -o \
              -name 'Assets.car' \
            \) \
            -print \
            || true


          echo
          echo "CFBundleIcons metadata:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIcons" \
            "$APP_PATH/Info.plist" \
            2>/dev/null \
            || true


          echo
          echo "CFBundleIcons~ipad metadata:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIcons~ipad" \
            "$APP_PATH/Info.plist" \
            2>/dev/null \
            || true


          ICON_METADATA="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleIcons" \
              "$APP_PATH/Info.plist" \
              2>/dev/null \
              || true
          )"

          ICON_FILES="$(
            find "$APP_PATH" \
              -type f \
              \( \
                -iname '*AppIcon*' \
                -o \
                -iname '*Icon*.png' \
                -o \
                -name 'Assets.car' \
              \) \
              -print
          )"

          if [ -z "$ICON_METADATA" ] && [ -z "$ICON_FILES" ]; then
            echo
            echo "WARNING:"
            echo "No compiled icon metadata/files were detected."
            echo "The IPA will still be produced so we can inspect it on-device."
          else
            echo
            echo "App icon compilation detected."
          fi


          echo
          echo "================================"
          echo "SUCCESS"
          echo "================================"

          echo "arm64 executable: yes"
          echo "SDL3 host: yes"
          echo "EngineSim visualization: yes"
          echo "Application bundle: yes"


      - name: Package IPA
        run: |
          rm -rf artifacts

          mkdir -p artifacts/Payload

          cp -R \
            "$APP_PATH" \
            artifacts/Payload/

          cat > artifacts/BUILD_INFO.txt <<'EOF'
          EngineSim iOS
          =============

          Platform: iPhoneOS
          Architecture: arm64
          Configuration: Debug

          SDL3: enabled
          Touch: enabled
          EngineSim core: enabled
          EngineSim visualization: enabled
          App icon source: enabled

          Code signing: disabled
          EOF

          cd artifacts

          zip \
            -qr \
            EngineSim-iOS-unsigned.ipa \
            Payload \
            BUILD_INFO.txt


      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: engine-sim-ios
          path: |
            artifacts/EngineSim-iOS-unsigned.ipa
            artifacts/BUILD_INFO.txt
          if-no-files-found: error
          compression-level: 1
