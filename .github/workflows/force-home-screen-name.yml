name: Force iOS Home Screen Name

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/force-home-screen-name.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch TestFlight display name
        run: python3 scripts/patch-home-screen-name.py

      - name: Commit patch and clean temporary files
        run: |
          set -euo pipefail
          rm scripts/patch-home-screen-name.py
          rm .github/workflows/force-home-screen-name.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Force spaced iOS Home Screen name"
          git push origin HEAD:master
