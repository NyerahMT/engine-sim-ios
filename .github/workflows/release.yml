name: Release desktop packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package and release (for example, v0.2.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-15
            preset: macos-arm64-package
            generator: ZIP
            extension: zip
          - name: Windows x86_64
            runner: windows-latest
            preset: windows-x86_64-desktop
            generator: ZIP
            extension: zip
          - name: Linux x86_64
            runner: ubuntu-latest
            preset: linux-x86_64-desktop
            generator: TGZ
            extension: tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: recursive

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Package
        run: cpack --config build/${{ matrix.preset }}/CPackConfig.cmake -G ${{ matrix.generator }}

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.preset }}
          path: open-engine-simulator-*.${{ matrix.extension }}
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" release-assets/*
          --verify-tag
          --title "Open Engine Simulator $RELEASE_TAG"
          --generate-notes
