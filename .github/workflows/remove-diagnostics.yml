name: Remove EngineSim Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore clean non-diagnostic files
        shell: bash
        run: |
          set -euo pipefail

          echo "Restoring clean iOS host..."
          git show 4e05f4e7b41157731e2a61188b66c7b4830cb6a8:ios/main.cpp \
            > ios/main.cpp

          echo "Restoring clean SDL GPU renderer..."
          git show f3f8032cad7899482e593f2f1b64a4995ddcca3d:src/sdl_gpu_renderer.cpp \
            > src/sdl_gpu_renderer.cpp

          echo "Restoring clean desktop application..."
          git show f12d9efdd70cac4c72b65bcd09bc9c5e9d69d9a3:src/desktop_application.cpp \
            > src/desktop_application.cpp

          echo "Restoring clean UI element..."
          git show 534f78d7473fc494a74b72eaa388a4a4dd6f446e:src/ui_element.cpp \
            > src/ui_element.cpp

      - name: Verify persistent diagnostics are gone
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking cleaned files..."

          if grep -nE \
            'engine-sim\.log|GPU-LOG|GPU \+|UI-TREE|renderDiagnosticLog|rendererDiagnosticLog|uiRenderDiagnosticLog|Persistent logger|DIAGNOSTIC SESSION' \
            ios/main.cpp \
            src/sdl_gpu_renderer.cpp \
            src/desktop_application.cpp \
            src/ui_element.cpp
          then
            echo ""
            echo "ERROR: Diagnostic logging still exists."
            exit 1
          fi

          echo ""
          echo "Diagnostic logging successfully removed."

      - name: Confirm permanent fixes remain untouched
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking fractional gauge fix..."

          grep -q \
            'float m_minorStep' \
            include/gauge.h

          echo "Checking latency unit fix..."

          grep -A3 -B3 \
            'm_audioLagGauge->m_unit' \
            src/performance_cluster.cpp \
            | grep -q '"ms"'

          echo "Permanent gauge and latency fixes are still present."

      - name: Show changed files
        shell: bash
        run: |
          git status --short

          echo ""
          echo "Only these application files should be restored:"
          echo "  ios/main.cpp"
          echo "  src/sdl_gpu_renderer.cpp"
          echo "  src/desktop_application.cpp"
          echo "  src/ui_element.cpp"

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            ios/main.cpp \
            src/sdl_gpu_renderer.cpp \
            src/desktop_application.cpp \
            src/ui_element.cpp

          if git diff --cached --quiet
          then
            echo "Nothing needed cleaning."
            exit 0
          fi

          git commit -m "Remove temporary diagnostic logging"
          git push
