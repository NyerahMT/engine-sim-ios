name: Apply Patch

on:
  workflow_dispatch:
    inputs:
      patch_base64:
        description: "Base64-encoded unified diff"
        required: true
        type: string

      commit_message:
        description: "Commit message"
        required: true
        default: "Apply patch"
        type: string

      upload_testflight:
        description: "Upload resulting build to TestFlight"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: apply-patch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode patch
        env:
          PATCH_BASE64: ${{ inputs.patch_base64 }}
        run: |
          set -euo pipefail

          printf '%s' "$PATCH_BASE64" \
            | base64 --decode \
            > /tmp/change.patch

          if [ ! -s /tmp/change.patch ]; then
            echo "::error::Decoded patch is empty."
            exit 1
          fi

          echo "Patch decoded successfully."
          echo "Size: $(wc -c </tmp/change.patch) bytes"

      - name: Validate patch
        run: |
          set -euo pipefail
          git apply --check /tmp/change.patch
          echo "Patch validation passed."

      - name: Apply patch
        run: |
          set -euo pipefail
          git apply /tmp/change.patch
          git diff --check
          echo "Patch applied successfully."

      - name: Show resulting changes
        run: |
          set -euo pipefail

          echo "=== STATUS ==="
          git status --short

          echo
          echo "=== DIFF STAT ==="
          git diff --stat

          echo
          echo "=== DIFF ==="
          git diff

      - name: Commit and push
        env:
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          set -euo pipefail

          git config user.name "engine-sim-ios patch bot"
          git config user.email "actions@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "::error::Patch produced no repository changes."
            exit 1
          fi

          git commit -m "$COMMIT_MESSAGE"
          git push

          echo "PATCHED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Trigger Ad Hoc IPA build
        if: ${{ !inputs.upload_testflight }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "TestFlight not requested."
          echo "Triggering ios-adhoc.yml for ref: $GITHUB_REF_NAME"

          gh workflow run ios-adhoc.yml \
            --ref "$GITHUB_REF_NAME"

          echo "Ad Hoc IPA workflow dispatched."

      - name: Trigger TestFlight build
        if: ${{ inputs.upload_testflight }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "TestFlight requested."
          echo "Triggering ios-core-manual.yml for ref: $GITHUB_REF_NAME"

          gh workflow run ios-core-manual.yml \
            --ref "$GITHUB_REF_NAME"

          echo "TestFlight workflow dispatched."

      - name: Summary
        run: |
          {
            echo "## Apply Patch"
            echo
            echo "Patch committed as \`$PATCHED_SHA\`."
            echo
            if [ "${{ inputs.upload_testflight }}" = "true" ]; then
              echo "🚀 Triggered **EngineSim iOS** for TestFlight."
            else
              echo "📦 Triggered **EngineSim iOS Ad Hoc** to produce an IPA artifact."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
