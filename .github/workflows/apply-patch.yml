name: Apply Patch

on:
  workflow_dispatch:
    inputs:
      patch_base64:
        description: "Base64-encoded unified diff"
        required: true
        type: string
      commit_message:
        description: "Commit message"
        required: true
        default: "Apply patch"
        type: string

permissions:
  contents: write

concurrency:
  group: apply-patch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode patch
        env:
          PATCH_BASE64: ${{ inputs.patch_base64 }}
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_BASE64" | base64 --decode > /tmp/change.patch

          if [ ! -s /tmp/change.patch ]; then
            echo "::error::Decoded patch is empty."
            exit 1
          fi

          echo "Patch decoded successfully."
          echo "Size: $(wc -c </tmp/change.patch) bytes"

      - name: Validate patch
        run: |
          set -euo pipefail

          # Reject patches that attempt to modify the patch workflow itself.
          # This keeps the permanent runner from silently changing its own
          # safety rules as part of an unrelated source patch.
          if grep -Eq \
            '^(--- a/|\+\+\+ b/)\.github/workflows/apply-patch\.yml$' \
            /tmp/change.patch; then
            echo "::error::This workflow cannot modify itself."
            exit 1
          fi

          git apply --check /tmp/change.patch

      - name: Apply patch
        run: |
          set -euo pipefail
          git apply /tmp/change.patch
          git diff --check

      - name: Show resulting changes
        run: |
          set -euo pipefail
          git status --short
          git diff --stat
          git diff

      - name: Commit and push
        env:
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          set -euo pipefail

          git config user.name "engine-sim-ios patch bot"
          git config user.email "actions@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "::error::Patch produced no repository changes."
            exit 1
          fi

          git commit -m "$COMMIT_MESSAGE"
          git push
